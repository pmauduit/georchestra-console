services:

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/html:/usr/share/nginx/html:ro
    ports:
      - "8090:80"

  database:
    image: georchestra/database:latest
    ports:
      - "15432:5432"

  ldap:
    image: georchestra/ldap:latest
    ulimits:
      nofile:
        soft: "1024"
        hard: "1024"
    ports:
      - "1389:389"

  smtp:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  gateway:
    image: georchestra/gateway:latest
    depends_on:
      - nginx
      - database
      - ldap
      - smtp
    volumes:
      - ./datadir:/etc/georchestra
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - pgsqlHost=database
      - pgsqlPort=5432
      - ldapHost=ldap
      - ldapPort=389
      - JAVA_TOOL_OPTIONS=-Dgeorchestra.datadir=/etc/georchestra -Dgeorchestra.gateway.services.console.target=http://host.docker.internal:8081/console/ -Dreactor.netty.http.server.accessLogEnabled=true
    ports:
      - "8080:8080"
