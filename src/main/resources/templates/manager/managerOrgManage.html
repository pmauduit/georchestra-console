<!DOCTYPE html>
<html lang="en" th:lang="${#locale.toLanguageTag()}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{manager.orgmanage.title})}">
  <meta charset="UTF-8">
  <title>Manage organization</title>
</head>
<body>
<th:block th:replace="~{fragments/layout :: appHeader('console')}"></th:block>
<main id="main-content" tabindex="-1" class="page">
  <section class="hero">
    <div class="hero-inline">
      <p class="hero-subtitle" th:text="#{manager.orgmanage.title}">Manage organization</p>
      <p class="hero-text" th:text="#{manager.orgmanage.description}">
        Delete the selected organization when it is no longer needed.
      </p>
    </div>
  </section>

  <nav class="manager-tabs">
    <a class="manager-tab" th:href="@{/manager/home}" th:text="#{nav.dashboard}">Dashboard</a>
    <a class="manager-tab" th:href="@{/manager/browse/all/users}" th:text="#{nav.users}">Users</a>
    <a class="manager-tab active" th:href="@{/manager/orgs/}" th:text="#{nav.orgs}">Orgs</a>
    <a class="manager-tab" th:href="@{/manager/roles/all}" th:text="#{nav.roles}">Roles</a>
    <a class="manager-tab" th:if="${isSuperuserView}" th:href="@{/manager/delegations}" th:text="#{nav.delegations}">Delegations</a>
    <a class="manager-tab" th:href="@{/manager/logs}" th:text="#{manager.logs.title}">Logs</a>
  </nav>

  <div class="layout">
    <section class="card">
      <div class="manager-user-header">
        <div>
          <p class="muted">
            <a th:href="@{/manager/org/{id}/infos(id=${managedOrg.id})}" th:text="#{manager.orgmanage.back}">Back to organization details</a>
          </p>
          <h1 th:text="${managedOrg.name}">Organization</h1>
          <p class="muted" th:text="${managedOrg.id}">org-id</p>
        </div>
      </div>

      <div id="manager-org-manage-feedback" class="alert" hidden aria-live="polite"></div>

      <div class="alert alert-error">
        <p th:text="#{manager.org.warning}">Warning, this action is irreversible.</p>
      </div>

      <div class="actions">
        <button type="button" id="delete-org-button" class="button button-danger" th:text="#{manager.org.delete}">Delete organization</button>
        <a class="button button-link" th:href="@{/manager/org/{id}/infos(id=${managedOrg.id})}" th:text="#{manager.userinfo.cancel}">Cancel</a>
      </div>
    </section>

    <aside class="stack">
      <section class="card">
        <h2 class="org-title" th:text="#{manager.userinfo.tabs}">Other tabs</h2>
        <nav class="role-list">
          <a class="role-link" th:href="@{/manager/org/{id}/infos(id=${managedOrg.id})}"
             th:text="#{manager.userinfo.tab.infos}">Infos</a>
          <a class="role-link" th:href="@{/manager/org/{id}/users(id=${managedOrg.id})}"
             th:text="#{manager.orginfo.tab.users}">Users</a>
          <a class="role-link is-active" href="#" th:text="#{manager.userinfo.tab.manage}">Manage</a>
        </nav>
      </section>
    </aside>
  </div>
</main>

<script th:inline="javascript">
  const deleteOrgButton = document.getElementById('delete-org-button');
  const orgManageFeedback = document.getElementById('manager-org-manage-feedback');
  const managedOrgId = /*[[${managedOrg.id}]]*/ 'org';
  const deleteOrgError = /*[[#{manager.org.deleteError}]]*/ 'Error deleting organization';
  const orgsBaseUrl = /*[[@{/manager/orgs/}]]*/ '/manager/orgs/';
  const deleteOrgBaseUrl = /*[[@{/private/orgs/}]]*/ '/private/orgs/';

  const showOrgManageFeedback = (message) => {
    orgManageFeedback.hidden = false;
    orgManageFeedback.className = 'alert alert-error';
    orgManageFeedback.textContent = message;
  };

  deleteOrgButton?.addEventListener('click', async () => {
    try {
      const response = await fetch(`${deleteOrgBaseUrl}${encodeURIComponent(managedOrgId)}`, {
        method: 'DELETE',
        headers: { 'X-Requested-With': 'XMLHttpRequest' }
      });
      if (!response.ok) {
        throw new Error(`HTTP ${response.status}`);
      }
      window.location.assign(orgsBaseUrl);
    } catch (error) {
      showOrgManageFeedback(deleteOrgError);
    }
  });
</script>
</body>
</html>
