<!DOCTYPE html>
<html lang="en" th:lang="${#locale.toLanguageTag()}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{manager.roles.title})}">
  <meta charset="UTF-8">
  <title>Roles</title>
</head>
<body>
<th:block th:replace="~{fragments/layout :: appHeader('console')}"></th:block>
<main id="main-content" tabindex="-1" class="page">
  <section class="hero">
    <div class="hero-inline">
      <h1 class="hero-subtitle" th:text="#{manager.roles.title}">Roles</h1>
      <p class="hero-text" th:text="#{manager.roles.description}">
        Browse roles available to the current administrator and filter the directory.
      </p>
    </div>
  </section>

  <nav class="manager-tabs">
    <a class="manager-tab" th:href="@{/manager/home}" th:text="#{nav.dashboard}">Dashboard</a>
    <a class="manager-tab" th:href="@{/manager/browse/all/users}" th:text="#{nav.users}">Users</a>
    <a class="manager-tab" th:href="@{/manager/orgs/}" th:text="#{nav.orgs}">Orgs</a>
    <a class="manager-tab active" th:href="@{/manager/roles/all}" th:text="#{nav.roles}">Roles</a>
    <a class="manager-tab" th:if="${isSuperuserView}" th:href="@{/manager/delegations}" th:text="#{nav.delegations}">Delegations</a>
    <a class="manager-tab" th:href="@{/manager/logs}" th:text="#{manager.logs.title}">Logs</a>
  </nav>

  <section class="manager-grid">
    <aside class="card manager-aside">
      <div class="manager-aside-header">
        <h2 th:text="#{manager.roles.scope.title}">Browse</h2>
        <a class="button button-link"
           th:if="${isSuperuser}"
           th:href="@{/manager/roles/new}"
           th:text="#{manager.roles.new}">
          New role
        </a>
      </div>
      <nav class="role-list">
        <a class="role-link is-active" th:href="@{/manager/roles/all}">
          <span th:text="#{manager.roles.all}">All roles</span>
          <span class="role-count" th:text="${roleCount}">0</span>
        </a>
      </nav>
    </aside>

    <section class="card">
      <div class="manager-panel-header">
        <div>
          <h2 th:text="#{manager.roles.all}">All roles</h2>
          <p class="muted" th:text="#{manager.roles.subtitle(${roleCount})}">0 roles</p>
        </div>
      </div>

      <form class="filters" method="get" th:action="@{/manager/roles/all}">
        <div class="form-grid manager-users-filter-grid">
          <div class="field">
            <label for="q" th:text="#{manager.roles.filter}">Filter</label>
            <input id="q" type="search" name="q" th:value="${query}" th:placeholder="#{manager.roles.filter}">
            <input type="hidden" name="sort" th:value="${sort}">
            <input type="hidden" name="dir" th:value="${dir}">
          </div>
        </div>
        <div class="actions">
          <button type="submit" class="button button-primary" th:text="#{manager.logs.filter.apply}">Apply</button>
          <a class="button button-link" th:href="@{/manager/roles/all}" th:text="#{manager.logs.filter.clear}">Clear</a>
        </div>
      </form>

      <div class="table-wrapper">
        <table class="table">
          <caption class="visually-hidden" th:text="#{manager.roles.title}">Roles</caption>
          <thead>
          <tr>
            <th th:attr="aria-sort=${sort == 'cn' ? (dir == 'asc' ? 'ascending' : 'descending') : 'none'}">
              <a class="table-sort"
                 th:href="@{/manager/roles/all(q=${query},sort='cn',dir=${sort == 'cn' ? nextSortDir : 'asc'})}">
                <span th:text="#{manager.role.cn}">Id</span>
                <span class="sort-indicator" th:if="${sort == 'cn'}" th:text="${dir == 'asc' ? '↑' : '↓'}">↑</span>
              </a>
            </th>
            <th th:attr="aria-sort=${sort == 'description' ? (dir == 'asc' ? 'ascending' : 'descending') : 'none'}">
              <a class="table-sort"
                 th:href="@{/manager/roles/all(q=${query},sort='description',dir=${sort == 'description' ? nextSortDir : 'asc'})}">
                <span th:text="#{manager.role.description}">Description</span>
                <span class="sort-indicator" th:if="${sort == 'description'}" th:text="${dir == 'asc' ? '↑' : '↓'}">↑</span>
              </a>
            </th>
            <th th:attr="aria-sort=${sort == 'members' ? (dir == 'asc' ? 'ascending' : 'descending') : 'none'}">
              <a class="table-sort"
                 th:href="@{/manager/roles/all(q=${query},sort='members',dir=${sort == 'members' ? nextSortDir : 'asc'})}">
                <span th:text="#{manager.role.membersCount}">Members</span>
                <span class="sort-indicator" th:if="${sort == 'members'}" th:text="${dir == 'asc' ? '↑' : '↓'}">↑</span>
              </a>
            </th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="roleItem : ${roles}">
            <td>
              <a th:href="@{/manager/roles/{cn}/infos(cn=${roleItem.cn})}"
                 th:title="${roleItem.description}">
                <span th:text="${roleItem.cn}">ROLE</span>
              </a>
              <span class="muted" th:if="${roleItem.favorite}">★</span>
            </td>
            <td th:text="${roleItem.description}">Description</td>
            <td th:text="${roleItem.usersCount}">0</td>
          </tr>
          <tr th:if="${#lists.isEmpty(roles)}">
            <td colspan="3" class="empty" th:text="#{manager.roles.empty}">No roles found</td>
          </tr>
          </tbody>
        </table>
      </div>
    </section>
  </section>
</main>
</body>
</html>
