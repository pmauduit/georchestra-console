<!DOCTYPE html>
<html lang="en" th:lang="${#locale.toLanguageTag()}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{account.emailSent.title})}">
  <meta charset="UTF-8">
  <title>E-mail sent</title>
</head>
<body>
<th:block th:replace="~{fragments/layout :: appHeader('console')}"></th:block>
<main id="main-content" tabindex="-1" class="page page-narrow">
  <section class="hero">
    <div class="hero-inline">
      <h1 class="hero-subtitle" th:text="#{account.emailSent.title}">E-mail sent</h1>
      <p class="hero-text" th:text="#{account.emailSent.emailChange.body}">
        A validation link has been sent to your new e-mail address. Please, check your e-mail box.
      </p>
    </div>
  </section>

  <section class="card">
    <a class="button button-primary" th:href="@{/}" th:text="#{account.emailSent.link}">Home</a>
  </section>
</main>
</body>
</html>
