<!DOCTYPE html>
<html lang="en" th:lang="${#locale.toLanguageTag()}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{account.emailSent.title})}">
  <meta charset="UTF-8">
  <title>Email sent</title>
</head>
<body>
<th:block th:replace="~{fragments/layout :: appHeader('console')}"></th:block>
<main id="main-content" tabindex="-1" class="page page-narrow">
  <section class="hero">
    <div class="hero-inline">
      <h1 class="hero-subtitle" th:text="#{account.emailSent.title}">Email sent</h1>
      <p class="hero-text" th:text="#{account.emailSent.passwordChange.body}">
        A validation link has been sent to your e-mail address.
      </p>
    </div>
  </section>
</main>
</body>
</html>
