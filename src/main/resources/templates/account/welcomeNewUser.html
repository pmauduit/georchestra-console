<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${moderatedSignup} ? #{newUserWelcome.title} : #{newUserWelcomeNoModeration.title})}">
  <meta charset="UTF-8">
  <title>Welcome</title>
</head>
<body>
<th:block th:replace="~{fragments/layout :: appHeader('console')}"></th:block>
<main class="page page-narrow">
  <section class="hero">
    <div class="hero-inline">
      <p class="hero-subtitle"
         th:text="${moderatedSignup} ? #{newUserWelcome.title} : #{newUserWelcomeNoModeration.title}">
        Request submitted
      </p>
      <p class="hero-text"
         th:text="${moderatedSignup} ? #{newUserWelcome.body} : #{newUserWelcomeNoModeration.body}">
        Your request has been submitted and should be processed in the next hours. Watch your e-mail box.
      </p>
    </div>
  </section>

  <section class="card">
    <a class="button button-primary" th:href="@{/}" th:text="#{newUserWelcome.link}">Log in</a>
  </section>
</main>
</body>
</html>
