<!DOCTYPE html>
<html lang="en" th:lang="${#locale.toLanguageTag()}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${moderatedSignup} ? #{account.welcome.pending.title} : #{account.welcome.direct.title})}">
  <meta charset="UTF-8">
  <title>Welcome</title>
</head>
<body>
<th:block th:replace="~{fragments/layout :: appHeader('console')}"></th:block>
<main id="main-content" tabindex="-1" class="page page-narrow">
  <section class="hero">
    <div class="hero-inline">
      <h1 class="hero-subtitle"
         th:text="${moderatedSignup} ? #{account.welcome.pending.title} : #{account.welcome.direct.title}">
        Request submitted
      </h1>
      <p class="hero-text"
         th:text="${moderatedSignup} ? #{account.welcome.pending.body} : #{account.welcome.direct.body}">
        Your request has been submitted and should be processed in the next hours. Watch your e-mail box.
      </p>
    </div>
  </section>

  <section class="card">
    <a class="button button-primary" th:href="@{/}" th:text="#{account.welcome.pending.link}">Log in</a>
  </section>
</main>
</body>
</html>
