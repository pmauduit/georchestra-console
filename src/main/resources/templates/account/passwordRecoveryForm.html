<!DOCTYPE html>
<html lang="en" th:lang="${#locale.toLanguageTag()}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{account.passwordRecovery.title})}">
  <meta charset="UTF-8">
  <title>Password recovery.</title>
  <script th:if="${recaptchaActivated}" src="https://www.google.com/recaptcha/api.js" async defer></script>
</head>
<body>
<th:block th:replace="~{fragments/layout :: appHeader('console')}"></th:block>
<main id="main-content" tabindex="-1" class="page page-narrow">
  <section class="hero">
    <div class="hero-inline">
      <h1 class="hero-subtitle" th:text="#{account.passwordRecovery.title}">Password recovery</h1>
      <p class="hero-text" th:text="#{account.passwordRecovery.description}">
        Recover your account password.
      </p>
    </div>
  </section>

  <section class="card">
    <div th:if="${message}" class="alert" th:text="${message}">Info</div>
    <div th:if="${badtoken}" class="alert alert-error" th:text="#{account.passwordRecovery.badtoken}">
      Invalid token
    </div>

    <form id="form" method="post" th:action="@{/account/passwordRecovery}" th:object="${passwordRecoveryFormBean}">
      <div th:if="${#fields.hasErrors('*')}" class="alert alert-error" th:text="#{form.error}">
        The form contains errors
      </div>

      <fieldset class="fieldset">
        <legend th:text="#{account.passwordRecovery.fieldset.email}">E-mail</legend>
        <div class="form-grid">
          <div class="field">
            <label for="email">
              <span th:text="#{email.label}">E-mail</span>
              <span class="required-marker">*</span>
            </label>
            <input id="email" type="email" th:field="*{email}"
                   autocomplete="email"
                   required>
            <p class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">
              Invalid e-mail
            </p>
          </div>
        </div>
      </fieldset>

      <fieldset th:if="${recaptchaActivated}" class="fieldset">
        <div class="recaptcha">
          <div class="g-recaptcha" th:attr="data-sitekey=${session.reCaptchaPublicKey}"></div>
          <input type="hidden" name="recaptcha_response_field" id="recaptcha_response_field">
          <p class="field-error" th:if="${#fields.hasErrors('recaptcha_response_field')}"
             th:errors="*{recaptcha_response_field}">
            Invalid captcha
          </p>
        </div>
      </fieldset>

      <div class="actions">
        <button id="submit-btn" type="submit" class="button button-primary" th:text="#{submit.label}">Submit</button>
      </div>
    </form>
  </section>
</main>
</body>
</html>
