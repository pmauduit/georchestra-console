<!DOCTYPE html>
<html lang="en" th:lang="${#locale.toLanguageTag()}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{account.changeEmail.title})}">
  <meta charset="UTF-8">
  <title>Change e-mail.</title>
</head>
<body>
<th:block th:replace="~{fragments/layout :: appHeader('console')}"></th:block>
<main id="main-content" tabindex="-1" class="page page-narrow">
  <section class="hero">
    <div class="hero-inline">
      <h1 class="hero-subtitle" th:text="#{account.changeEmail.title}">Change e-mail.</h1>
      <p class="hero-text" th:text="#{account.changeEmail.description}">
        You will receive a validation link to your new e-mail address to confirm this change.
      </p>
    </div>
  </section>

  <section class="card">
    <div th:if="${message}" class="alert" th:text="${message}">Info</div>

    <form id="form" method="post" th:object="${changeEmailFormBean}" novalidate>
      <div th:if="${#fields.hasErrors('*')}" class="alert alert-error" th:text="#{form.error}">
        The form contains errors
      </div>

      <fieldset class="fieldset">
        <legend th:text="#{account.changeEmail.fieldset.email}">New e-mail address</legend>
        <div class="form-grid">
          <div class="field">
            <label for="newEmail">
              <span th:text="#{email.label}">E-mail</span>
              <span class="required-marker">*</span>
            </label>
            <input id="newEmail" type="email" th:field="*{newEmail}"
                   autocomplete="email"
                   required>
            <p class="field-error"
               th:if="${#fields.hasErrors('newEmail')}"
               th:errors="*{newEmail}">
              Invalid e-mail
            </p>
          </div>
        </div>
      </fieldset>

      <div class="actions">
        <button type="submit" class="button button-primary" th:text="#{submit.label}">Submit</button>
      </div>
    </form>
  </section>
</main>
</body>
</html>
