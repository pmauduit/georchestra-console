<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{passwordUpdated.title})}">
  <meta charset="UTF-8">
  <title>Password updated</title>
</head>
<body>
<th:block th:replace="~{fragments/layout :: appHeader('console')}"></th:block>
<main class="page page-narrow">
  <section class="hero">
    <div class="hero-inline">
      <p class="hero-subtitle" th:text="#{passwordUpdated.title}">Password updated</p>
      <p class="hero-text" th:text="#{passwordUpdated.body}">
        The password has been successfully updated. You will now be able to log in.
      </p>
    </div>
  </section>

  <section class="card">
    <a class="button button-primary" th:href="@{/}" th:text="#{passwordUpdated.link}">Log in</a>
  </section>
</main>
</body>
</html>
